<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Medicine Reminder</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="firebase.js" defer></script>
  <script type="module" src="app.js" defer></script>
</head>

<body>
  <div class="auth-container">
    <div class="auth-box glass-panel">
      <h2>Smart Medicine Reminder</h2>
      <p class="subtitle">Secure Login / Signup</p>

      <form id="auth-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>

        <div class="auth-buttons">
          <button type="submit" class="btn primary-btn" id="login-btn">Login</button>
          <button type="button" class="btn secondary-btn" id="signup-btn">Sign Up</button>
        </div>
      </form>
      <div id="auth-error" class="error-msg" style="display: none;"></div>
      <div id="auth-success" class="success-msg" style="display: none;"></div>
    </div>
  </div>
</body>

</html>
